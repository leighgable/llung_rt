[project]
name = "llung_rt"
version = "0.1.0"
description = "onnx llung_rt"
requires-python = ">=3.14"
dependencies = [
    "torch",
    "treescope",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "ipython>=9.12.0",
    "safetensors>=0.7.0",
    "einops>=0.8.2",
    "pandas>=3.0.3",
    "datasets>=4.8.5",
    "scipy>=1.17.1",
    "plotly>=6.7.0",
    "typer>=0.25.1",
    "onnx>=1.22.0",
    "onnxscript>=0.7.1",
    "transformers>=5.16.1",
    "peft>=0.20.0",
]

[project.scripts]
o_0 = "cli:run"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

